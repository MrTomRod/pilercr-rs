name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test workspace
        run: cargo test --release --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
